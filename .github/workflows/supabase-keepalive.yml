name: Supabase Keep-Alive

on:
  schedule:
    # Runs daily at 03:00 UTC (~08:00 PKT)
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (read + write) to reset inactivity timer
        run: |
          set -e
          SUPABASE_URL="https://cnvckclwrixpobigdrmu.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNudmNrY2x3cml4cG9iaWdkcm11Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Mzg4NTUsImV4cCI6MjEwMTQxNDg1NX0.9COZcwPbhHfybivjlkYRbwolo4_dAFnHvw8AChBXIrY"

          echo "Reading pm_keepalive..."
          curl -sf -X GET "$SUPABASE_URL/rest/v1/pm_keepalive?select=id,last_ping" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY"

          echo ""
          echo "Updating pm_keepalive.last_ping (write request, counts as real activity)..."
          curl -sf -X PATCH "$SUPABASE_URL/rest/v1/pm_keepalive?id=eq.1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

          echo ""
          echo "Keep-alive ping complete."
